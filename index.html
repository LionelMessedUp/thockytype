<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>thockytype — typing test bahasa indonesia</title>
<meta name="description" content="Latihan mengetik bahasa Indonesia dengan suara keyboard mechanical yang digenerate langsung di browser. Tanpa file audio, tanpa internet." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='6' y='6' width='88' height='88' rx='20' fill='%23181b21' stroke='%23e9a75d' stroke-width='5'/><text x='50' y='72' font-size='58' font-family='monospace' fill='%23e9a75d' text-anchor='middle'>t</text></svg>" />
<link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>

<div class="app">

  <header class="top">
    <div class="brand">
      <div class="keycap" aria-hidden="true">t</div>
      <h1>thocky<span>type</span></h1>
    </div>

    <div class="sound">
      <div class="pulse" id="pulse" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

      <button class="icon-btn" id="soundBtn" aria-pressed="true" title="suara keyboard">
        <svg class="ico-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4V5Z" fill="currentColor" stroke="none"/>
          <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
          <path d="M18.5 6a9 9 0 0 1 0 12"/>
        </svg>
        <svg class="ico-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4V5Z" fill="currentColor" stroke="none"/>
          <path d="m16 9 5 6M21 9l-5 6"/>
        </svg>
      </button>

      <select id="profileSel" class="select" title="profil suara">
        <option value="thock">thock</option>
        <option value="cream">cream</option>
        <option value="clack">clack</option>
        <option value="clicky">clicky</option>
        <option value="linear">linear</option>
      </select>

      <input id="volume" class="range" type="range" min="0" max="1" step="0.01" value="0.55" title="volume" />
    </div>
  </header>

  <section class="bar">
    <div class="seg" id="modeSeg">
      <button data-mode="time">waktu</button>
      <button data-mode="words">kata</button>
      <button data-mode="quote">kutipan</button>
    </div>
    <div class="seg" id="valueSeg"></div>
  </section>

  <main class="stage">
    <div class="hud">
      <div class="hud-main">
        <span id="timer">30</span>
        <small id="hudLabel">sisa waktu</small>
      </div>
      <div class="hud-side">
        <div class="stat"><span id="liveWpm">0</span><small>wpm</small></div>
        <div class="stat"><span id="liveAcc">100%</span><small>akurasi</small></div>
      </div>
    </div>

    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>

    <div class="words-wrap" id="wordsWrap">
      <div class="words" id="words"></div>
      <div class="caret" id="caret"></div>
    </div>

    <div class="keyboard" id="keyboard" aria-hidden="true"></div>

    <div class="hint" id="hint">mulai mengetik untuk memulai</div>
  </main>

  <footer class="foot">
    <p>
      <kbd>tab</kbd> ulangi &middot; <kbd>esc</kbd> mulai baru &middot;
      suara keyboard disintesis langsung di browser, tanpa file audio
    </p>
  </footer>

</div>

<div class="overlay" id="results" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-label="hasil latihan">
    <div class="card-head">
      <div class="card-head-left">
        <span class="eyebrow">hasil</span>
        <span class="chip" id="resMode">waktu 30s</span>
      </div>
      <button class="icon-btn" id="closeBtn" title="tutup (esc)">&#10005;</button>
    </div>

    <div class="big">
      <div class="big-num" id="resWpm">0</div>
      <div class="big-label">kata per menit</div>
    </div>

    <div class="grid">
      <div class="cell"><span id="resAcc">0%</span><small>akurasi</small></div>
      <div class="cell"><span id="resRaw">0</span><small>raw wpm</small></div>
      <div class="cell"><span id="resCons">0%</span><small>konsistensi</small></div>
      <div class="cell"><span id="resErr">0</span><small>kesalahan</small></div>
      <div class="cell"><span id="resTime">0s</span><small>waktu</small></div>
      <div class="cell"><span id="resChars">0</span><small>karakter benar</small></div>
    </div>

    <canvas id="chart" height="140" aria-label="grafik kecepatan"></canvas>

    <div class="card-foot">
      <span class="best" id="resBest"></span>
      <div class="actions">
        <button class="btn" id="againBtn">ulangi<span class="kbd">tab</span></button>
        <button class="btn ghost" id="modeBtn">ganti mode<span class="kbd">esc</span></button>
      </div>
    </div>
  </div>
</div>

<noscript><p style="padding:2rem;font-family:monospace">thockytype butuh javascript untuk berjalan.</p></noscript>

<script src="js/words.js?v=3"></script>
<script src="js/sound.js?v=2"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
